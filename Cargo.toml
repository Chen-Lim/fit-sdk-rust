[package]
name = "fit-sdk-rust"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Chen <chenchemlim@gmail.com>"]
description = "Pure-Rust implementation of the Garmin FIT (Flexible and Interoperable Data Transfer) protocol."
repository = "https://github.com/Chen-Lim/fit-sdk-rust"
documentation = "https://docs.rs/fit-sdk-rust"
readme = "README.md"
keywords = ["fit", "garmin", "sport", "decoder", "encoder"]
categories = ["parser-implementations", "encoding"]
exclude = ["tests/fixtures/", "code-review-report.html", "plan.md"]

[lib]
name = "fit"

[features]
default = ["chrono"]
chrono = ["dep:chrono"]

[dependencies]
thiserror = "2.0"
smallvec = { version = "1.13", features = ["const_generics"] }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
proptest = "1.6"
rand = "0.9"
